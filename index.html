<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090d24">
<meta name="description" content="NOVA GRAB 2.0 - Catch the stars. Dodge the danger.">
<title>NOVA GRAB 2.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d24;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#273b78 0,#080d24 68%)}#game{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);max-width:480px;max-height:854px;overflow:hidden;background:linear-gradient(180deg,#172653 0%,#111b3d 48%,#090e26 100%);box-shadow:0 0 55px #000a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;gap:6px;padding:12px 12px;font-weight:850;pointer-events:none}.pill{background:#ffffff18;border:1px solid #ffffff32;border-radius:18px;padding:7px 10px;backdrop-filter:blur(8px);font-size:13px;text-shadow:0 2px 5px #0008}.topbuttons{position:absolute;right:12px;top:62px;display:flex;gap:7px}.topbuttons button{width:auto;padding:8px 11px;font-size:12px;background:#ffffff20;color:white;box-shadow:none;border:1px solid #ffffff45}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#060b20b9;text-align:center}.panel{width:100%;max-width:360px;padding:25px 21px;border:1px solid #ffffff38;border-radius:27px;background:linear-gradient(145deg,#26396f,#121d43);box-shadow:0 18px 60px #0009}.logo{font-weight:1000;letter-spacing:2px;font-size:clamp(34px,9vw,48px);line-height:1;color:#ffe477;text-shadow:0 0 18px #ffbd4b88,0 3px 0 #9e5b2b}.tag{font-size:11px;letter-spacing:3px;color:#d5e0ff;margin:9px 0 18px}h2{font-size:24px;margin:0 0 9px}p{color:#dce5ff;line-height:1.45;margin:9px 0 18px;font-size:14px}button{border:0;border-radius:15px;padding:14px 18px;width:100%;font-size:16px;font-weight:900;color:#182044;background:linear-gradient(135deg,#ffe66d,#ffb34b);box-shadow:0 5px 0 #bd762d;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #bd762d}.secondary{margin-top:11px;background:#ffffff18;color:white;border:1px solid #ffffff38;box-shadow:none}.small{font-size:11px;color:#c4d0f2;margin-top:15px}.stats{display:flex;justify-content:space-around;margin:14px 0 18px}.stat strong{display:block;color:#ffe477;font-size:22px}.stat span{font-size:10px;color:#d3ddfb}.hidden{display:none!important}.powerbar{position:absolute;left:12px;right:12px;bottom:14px;height:7px;border-radius:10px;background:#ffffff20;overflow:hidden;pointer-events:none}.powerbar>div{height:100%;width:0;background:linear-gradient(90deg,#62e7ff,#a58bff);transition:width .08s}.toast{position:absolute;top:115px;left:0;right:0;text-align:center;font-weight:900;color:#ffe477;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div id="game">
 <canvas id="c" aria-label="NOVA GRAB arcade game"></canvas>
 <div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">🏆 <span id="best">0</span></div></div>
 <div class="topbuttons"><button id="sound">♫ Sound: On</button><button id="pause" class="hidden">Ⅱ Pause</button></div>
 <div id="toast" class="toast"></div><div class="powerbar"><div id="powerfill"></div></div>
 <div id="overlay" class="overlay"><div class="panel">
  <div class="logo">NOVA GRAB</div><div class="tag">CATCH • DODGE • SURVIVE</div>
  <div style="font-size:48px">🌌 ⭐ 🧺</div>
  <h2 id="heading">The galaxy needs a catcher!</h2>
  <p id="message">Catch stars, grab rare Golden Novas and dodge bombs. Collect power-ups to survive longer.</p>
  <div class="stats"><div class="stat"><strong id="menuBest">0</strong><span>BEST SCORE</span></div><div class="stat"><strong>3</strong><span>STARTING LIVES</span></div></div>
  <button id="start">START GAME</button><button id="how" class="secondary">HOW TO PLAY</button>
  <div class="small">Drag to move • Keyboard: ← → • Sound can be muted</div>
 </div></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d'),game=$('game');
let W=400,H=710,dpr=1,player,items=[],particles=[],score=0,lives=3,best=+(localStorage.getItem('nova-grab-best')||0),running=false,paused=false,last=0,spawn=0,keys={},pointer=null,magnet=0,shield=0,extraLifeAt=0,soundOn=true,audio=null,toastTimer=0;
$('best').textContent=best;$('menuBest').textContent=best;
function resize(){const r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player)player.y=H-78;}
addEventListener('resize',resize);resize();
function beep(freq=600,dur=.08,type='sine',vol=.045){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}catch(e){}}
function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1000);}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('best').textContent=best;$('menuBest').textContent=best;}
function reset(){score=0;lives=3;items=[];particles=[];spawn=0;magnet=0;shield=0;extraLifeAt=100;player={x:W/2,y:H-78,w:76};hud();$('powerfill').style.width='0%';}
function show(title,msg,button='PLAY AGAIN'){$('heading').textContent=title;$('message').textContent=msg;$('start').textContent=button;$('overlay').classList.remove('hidden');}
function begin(){reset();$('overlay').classList.add('hidden');$('pause').classList.remove('hidden');running=true;paused=false;$('pause').textContent='Ⅱ Pause';last=performance.now();requestAnimationFrame(loop);beep(520,.12);}
function finish(){running=false;$('pause').classList.add('hidden');show('GAME OVER',`You scored ${score} points. Your best is ${best}. Ready for another cosmic run?`,'PLAY AGAIN');beep(180,.3,'sawtooth');}
function pause(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶ Resume':'Ⅱ Pause';if(!paused){last=performance.now();requestAnimationFrame(loop);}}
$('start').onclick=begin;$('pause').onclick=pause;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='♫ Sound: '+(soundOn?'On':'Off');if(soundOn)beep();};
$('how').onclick=()=>show('HOW TO PLAY','Catch ⭐ stars for 1 point and 🌟 Golden Novas for 10. Avoid 💣 bombs. 🧲 attracts stars, 🛡️ blocks one bomb, and 💚 gives an extra life. Every 100 points earns a bonus life.','GOT IT');
function pointerX(e){const r=canvas.getBoundingClientRect();return(e.clientX-r.left)/r.width*W;}
canvas.addEventListener('pointerdown',e=>{pointer=pointerX(e);canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(pointer!==null&&running&&!paused)player.x=pointerX(e);});
canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape')pause();});
addEventListener('keyup',e=>keys[e.key]=false);
function spawnItem(){let r=Math.random(),kind=r<.17?'bomb':r<.25?'nova':r<.31?'magnet':r<.36?'shield':r<.395?'life':'star';items.push({x:25+Math.random()*(W-50),y:-32,r:kind==='bomb'?16:14,kind,speed:150+Math.random()*75+Math.min(score*.85,160),rot:Math.random()*6});}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*210,vy:(Math.random()-.7)*210,life:.55,color});}
function drawBg(now){ctx.clearRect(0,0,W,H);for(let i=0;i<55;i++){let x=(i*83)%W,y=(i*137+now*.012*(i%3+1))%H;ctx.globalAlpha=.18+(i%4)*.12;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,i%3===0?1.5:1,0,7);ctx.fill();}ctx.globalAlpha=1;}
function basket(){ctx.save();ctx.translate(player.x,player.y);if(shield>0){ctx.strokeStyle='#63e9ff';ctx.lineWidth=3;ctx.shadowColor='#63e9ff';ctx.shadowBlur=14;ctx.beginPath();ctx.ellipse(0,7,48,30,0,0,7);ctx.stroke();}if(magnet>0){ctx.strokeStyle='#b49aff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,43,Math.PI,0);ctx.stroke();}ctx.fillStyle='#ef9b39';ctx.strokeStyle='#ffe0a0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-35,-2);ctx.lineTo(-28,22);ctx.quadraticCurveTo(0,34,28,22);ctx.lineTo(35,-2);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-3,25,Math.PI,0);ctx.stroke();ctx.strokeStyle='#ffd17a';ctx.lineWidth=2;for(let x=-20;x<=20;x+=10){ctx.beginPath();ctx.moveTo(x,2);ctx.lineTo(x*.8,23);ctx.stroke();}ctx.restore();}
const emoji={star:'⭐',nova:'🌟',bomb:'💣',magnet:'🧲',shield:'🛡️',life:'💚'};
function loop(now){if(!running||paused)return;let dt=Math.min((now-last)/1000,.035);last=now;drawBg(now);
if(keys.ArrowLeft)player.x-=310*dt;if(keys.ArrowRight)player.x+=310*dt;player.x=Math.max(40,Math.min(W-40,player.x));
magnet=Math.max(0,magnet-dt);shield=Math.max(0,shield-dt);$('powerfill').style.width=Math.max(magnet,shield)/8*100+'%';
spawn+=dt;let interval=Math.max(.29,.83-score*.002);if(spawn>interval){spawn=0;spawnItem();}
for(let i=items.length-1;i>=0;i--){let a=items[i];a.y+=a.speed*dt;a.rot+=dt*2;
if(magnet>0&&a.kind!=='bomb'){let dx=player.x-a.x,dy=player.y-a.y,dist=Math.hypot(dx,dy);if(dist<155){a.x+=dx*dt*2.6;a.y+=dy*dt*2.6;}}
ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.sin(a.rot)*.12);ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=a.kind==='nova'?'#ffe66d':'transparent';ctx.shadowBlur=a.kind==='nova'?15:0;ctx.fillText(emoji[a.kind],0,0);ctx.restore();
if(a.y>player.y-12&&a.y<player.y+28&&Math.abs(a.x-player.x)<43){let k=a.kind;items.splice(i,1);
if(k==='bomb'){if(shield>0){shield=0;burst(a.x,a.y,'#65eaff');say('SHIELD SAVED YOU!');beep(800,.16);}else{lives--;burst(a.x,a.y,'#ff6262');beep(140,.2,'sawtooth');}}
else{if(k==='star')score++;if(k==='nova'){score+=10;say('GOLDEN NOVA +10!');beep(950,.15);}if(k==='magnet'){magnet=8;say('MAGNET POWER!');beep(700,.15);}if(k==='shield'){shield=8;say('SHIELD ACTIVE!');beep(800,.15);}if(k==='life'){lives=Math.min(5,lives+1);say('EXTRA LIFE!');beep(880,.15);}burst(a.x,a.y,k==='nova'?'#ffe66d':'#8eeaff');}
if(score>=extraLifeAt){lives=Math.min(5,lives+1);extraLifeAt+=100;say('100 POINT BONUS LIFE!');}
if(score>best){best=score;localStorage.setItem('nova-grab-best',best);}hud();if(lives<=0){finish();return;}}
else if(a.y>H+35)items.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life*1.8);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1);}ctx.globalAlpha=1;basket();requestAnimationFrame(loop);}
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}
</script>
</body></html>
